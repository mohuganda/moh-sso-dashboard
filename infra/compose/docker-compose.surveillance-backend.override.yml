# Local development cutover after the standalone surveillance import is verified.
# Combine with docker-compose.dev.yml and the same private settings as the running stack.
services:
  backend:
    networks:
      sso_network: {}
      surveillance: {}
    environment:
      SURVEILLANCE_DB_HOST: sso-surveillance-db
      SURVEILLANCE_DB_PORT: "5432"
      SURVEILLANCE_DB_NAME: observatory
      SURVEILLANCE_DB_USER: surveillance
      SURVEILLANCE_DB_PASSWORD: ${SURVEILLANCE_DB_PASSWORD:?Set the private surveillance password}
      SURVEILLANCE_DB_ENABLE_SSL: "false"
networks:
  surveillance:
    external: true
    name: moh-surveillance_default
