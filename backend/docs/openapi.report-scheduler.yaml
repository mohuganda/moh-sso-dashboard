# Report Scheduler HTTP contract pinned to the standalone module.
components:
  schemas:
    report_scheduler.Artifact:
      properties:
        contentType:
          type: string
        createdAt:
          format: date-time
          type: string
        downloadUrl:
          type: string
        executionId:
          type: string
        fileName:
          type: string
        id:
          type: string
        sizeBytes:
          format: int64
          type: integer
      type: object
    report_scheduler.CreateScheduleRequest:
      properties:
        cronExpression:
          type: string
        description:
          type: string
        enabled:
          nullable: true
          type: boolean
        frequency:
          type: string
        healthBiReportId:
          type: string
        healthContext:
          $ref: '#/components/schemas/report_scheduler.HealthContext'
        outputConfig:
          $ref: '#/components/schemas/report_scheduler.OutputConfig'
        outputFormat:
          type: string
        parameters:
          additionalProperties: {}
          type: object
        periodStrategy:
          type: string
        recipients:
          items:
            $ref: '#/components/schemas/report_scheduler.ScheduleRecipient'
          type: array
        reportName:
          type: string
        timezone:
          type: string
        timing:
          $ref: '#/components/schemas/report_scheduler.ScheduleTiming'
      required:
        - healthBiReportId
        - reportName
        - frequency
        - timezone
        - periodStrategy
        - outputFormat
      type: object
    report_scheduler.Delivery:
      properties:
        artifactId:
          type: string
        attempts:
          format: int64
          type: integer
        createdAt:
          format: date-time
          type: string
        deliveryChannel:
          type: string
        executionId:
          type: string
        id:
          type: string
        lastAttemptAt:
          format: date-time
          nullable: true
          type: string
        lastError:
          type: string
        maxAttempts:
          format: int64
          type: integer
        nextRetryAt:
          format: date-time
          nullable: true
          type: string
        recipientType:
          type: string
        recipientValue:
          type: string
        sentAt:
          format: date-time
          nullable: true
          type: string
        status:
          type: string
        updatedAt:
          format: date-time
          type: string
      type: object
    report_scheduler.Execution:
      properties:
        createdAt:
          format: date-time
          type: string
        errorMessage:
          type: string
        finishedAt:
          format: date-time
          nullable: true
          type: string
        generationAttempts:
          format: int64
          type: integer
        healthBiJobId:
          type: string
        id:
          type: string
        lastAttemptAt:
          format: date-time
          nullable: true
          type: string
        maxGenerationAttempts:
          format: int64
          type: integer
        nextRetryAt:
          format: date-time
          nullable: true
          type: string
        outputFormat:
          type: string
        parameters:
          additionalProperties: {}
          type: object
        reportId:
          type: string
        resolvedPeriod:
          allOf:
            - $ref: '#/components/schemas/report_scheduler.ResolvedPeriod'
          nullable: true
        scheduleId:
          nullable: true
          type: string
        scheduledFor:
          format: date-time
          nullable: true
          type: string
        startedAt:
          format: date-time
          nullable: true
          type: string
        status:
          type: string
        triggerType:
          type: string
        triggeredBy:
          type: string
      type: object
    report_scheduler.ExecutionDetail:
      properties:
        artifacts:
          items:
            $ref: '#/components/schemas/report_scheduler.Artifact'
          type: array
        deliveries:
          items:
            $ref: '#/components/schemas/report_scheduler.Delivery'
          type: array
        execution:
          $ref: '#/components/schemas/report_scheduler.Execution'
        schedule:
          allOf:
            - $ref: '#/components/schemas/report_scheduler.Schedule'
          nullable: true
      type: object
    report_scheduler.HealthBIParameter:
      properties:
        defaultValue: {}
        description:
          type: string
        label:
          type: string
        metadata:
          additionalProperties: {}
          type: object
        name:
          type: string
        options:
          items: {}
          type: array
        required:
          type: boolean
        type:
          type: string
      type: object
    report_scheduler.HealthBIReport:
      properties:
        category:
          type: string
        description:
          type: string
        id:
          type: string
        metadata:
          additionalProperties: {}
          type: object
        name:
          type: string
        supportedFormats:
          items:
            type: string
          type: array
      type: object
    report_scheduler.HealthContext:
      properties:
        district:
          type: string
        facility:
          type: string
        level:
          type: string
      type: object
    report_scheduler.ModuleResponse:
      properties:
        healthBiEnabled:
          type: boolean
        healthContext:
          $ref: '#/components/schemas/report_scheduler.HealthContext'
        name:
          type: string
