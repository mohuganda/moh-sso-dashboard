          type: boolean
        status:
          type: string
      type: object
    report_scheduler.OutputConfig:
      properties:
        deliveryMode:
          type: string
        fileNamePrefix:
          type: string
        format:
          type: string
      type: object
    report_scheduler.PortalReport:
      properties:
        artifact:
          $ref: '#/components/schemas/report_scheduler.Artifact'
        deliveredAt:
          format: date-time
          type: string
        deliveryId:
          type: string
        executionId:
          type: string
        reportId:
          type: string
        reportName:
          type: string
      type: object
    report_scheduler.RecipientOption:
      properties:
        id:
          type: string
        label:
          type: string
        type:
          type: string
        value:
          type: string
      type: object
    report_scheduler.RecipientPreview:
      properties:
        emailCount:
          format: int64
          type: integer
        emailRecipients:
          items:
            type: string
          type: array
        portalCount:
          format: int64
          type: integer
        portalRecipients:
          items:
            type: string
          type: array
      type: object
    report_scheduler.ResolvedPeriod:
      properties:
        end:
          format: date-time
          type: string
        start:
          format: date-time
          type: string
        strategy:
          type: string
      type: object
    report_scheduler.Schedule:
      properties:
        createdAt:
          format: date-time
          type: string
        createdBy:
          type: string
        cronExpression:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        frequency:
          type: string
        healthBiReportId:
          type: string
        healthContext:
          $ref: '#/components/schemas/report_scheduler.HealthContext'
        id:
          type: string
        lastRunAt:
          format: date-time
          nullable: true
          type: string
        nextRunAt:
          format: date-time
          nullable: true
          type: string
        outputConfig:
          $ref: '#/components/schemas/report_scheduler.OutputConfig'
        outputFormat:
          type: string
        parameters:
          additionalProperties: {}
          type: object
        periodStrategy:
          type: string
        recipients:
          items:
            $ref: '#/components/schemas/report_scheduler.ScheduleRecipient'
          type: array
        reportName:
          type: string
        timezone:
          type: string
        timing:
          $ref: '#/components/schemas/report_scheduler.ScheduleTiming'
        updatedAt:
          format: date-time
          type: string
      type: object
    report_scheduler.ScheduleRecipient:
      properties:
        deliveryChannel:
          type: string
        id:
          type: string
        type:
          type: string
        value:
          type: string
      required:
        - type
        - value
        - deliveryChannel
      type: object
    report_scheduler.ScheduleTiming:
      properties:
        dayOfMonth:
          format: int64
          type: integer
        timeOfDay:
          type: string
        weekday:
          format: int64
          type: integer
      type: object
    report_scheduler.SchedulerOverview:
      properties:
        completed24h:
          format: int64
          type: integer
        deliveryFailures24h:
          format: int64
          type: integer
        deliveryStatuses:
          items:
            $ref: '#/components/schemas/report_scheduler.SchedulerStatusCount'
          type: array
        enabledSchedules:
          format: int64
          type: integer
        executionStatuses:
          items:
            $ref: '#/components/schemas/report_scheduler.SchedulerStatusCount'
          type: array
        executions24h:
          format: int64
          type: integer
        failed24h:
          format: int64
          type: integer
        generatedAt:
          format: date-time
          type: string
        recentFailures:
          items:
            $ref: '#/components/schemas/report_scheduler.Execution'
          type: array
        retryingNow:
          format: int64
          type: integer
        successRate24h:
          format: double
          type: number
        totalSchedules:
          format: int64
          type: integer
        workerHealthy:
          type: boolean
        workerLastCycleError:
          type: string
        workerLastHeartbeatAt:
          format: date-time
          nullable: true
          type: string
      type: object
    report_scheduler.SchedulerStatusCount:
      properties:
        count:
          format: int64
          type: integer
        status:
          type: string
      type: object
