root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/sso-server ./cmd/server"
entrypoint = ["./tmp/sso-server"]
include_ext = ["go", "html", "tmpl", "tpl", "yaml", "yml"]
exclude_dir = ["bin", "tmp", "vendor"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
follow_symlink = false

# Filesystem notifications from macOS bind mounts can be dropped by Docker
# Desktop. Polling makes reloads deterministic across macOS and Linux.
poll = true
poll_interval = 500
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = 500000000

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
