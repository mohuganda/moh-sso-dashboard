root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/sso-server ./cmd/server"
  bin = "./tmp/sso-server"
  full_bin = "./tmp/sso-server"
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "env"]
  exclude_dir = ["tmp", "vendor", ".git"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = true
  follow_symlink = true
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = 1000
  rerun = false
  rerun_delay = 500

[log]
  time = true
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true
