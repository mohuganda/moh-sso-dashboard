version: "2"
sql:
  - schema:
      - "internal/db/migrations"
      - "internal/db/surveillance_migrations"
    queries: "internal/db/query"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "internal/db/sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
