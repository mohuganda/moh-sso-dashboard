systems:
    - clientId: dashboard-web
      displayName: Integrated Health Portal
      description: Central portal shell
      icon: dashboard
      launchUrl: /portal
      category: platform
      enabled: true
      accessRoles:
        - dashboard-web_access
      roles:
        - name: dashboard-web_access
          displayName: Dashboard Access
          permissions:
            - portal:access
            - systems:read
            - systems:launch
        - name: portal_admin
          displayName: Portal Admin
          permissions:
            - '*'
        - name: portal_manager
          displayName: Portal Manager
          permissions:
            - portal:access
            - systems:read
            - systems:launch
            - users:read
            - clients:read
            - announcements:read
            - documents:read
            - document_templates:read
            - surveillance:read
            - report_browser:read
            - notifications:read
        - name: portal_user
          displayName: Portal User
          permissions:
            - portal:access
            - systems:read
            - systems:launch
    - clientId: integrated-outbreak-system
      displayName: Integrated Outbreak System
      description: Outbreak surveillance and response
      icon: outbreak
      launchUrl: /portal/apps/dwh/surveillance
      category: surveillance
      enabled: true
      accessRoles:
        - integrated-outbreak-system_access
        - viewer
        - data_entry
        - surveillance_officer
        - manager
        - admin
        - super_admin
      roles:
        - name: super_admin
          permissions:
            - outbreak:access
            - outbreak:manage
            - surveillance:read
            - surveillance:import
            - surveillance:manage_locations
            - surveillance:manage_alerts
            - data_quality:read
            - data_quality:write
            - data_quality:resolve
            - documents:read
            - documents:write
            - documents:process
        - name: admin
          permissions:
            - outbreak:access
            - outbreak:manage
            - surveillance:read
            - surveillance:import
            - surveillance:manage_locations
            - surveillance:manage_alerts
            - data_quality:read
            - data_quality:write
            - data_quality:resolve
        - name: manager
          permissions:
            - outbreak:access
            - surveillance:read
            - data_quality:read
            - data_quality:write
            - documents:read
        - name: viewer
          permissions:
            - outbreak:access
            - surveillance:read
            - data_quality:read
            - documents:read
        - name: data_entry
          permissions:
            - outbreak:access
            - surveillance:read
            - surveillance:import
            - data_quality:read
            - data_quality:write
        - name: lab_technician
          permissions:
            - outbreak:access
            - surveillance:read
            - data_quality:read
            - data_quality:write
        - name: surveillance_officer
          permissions:
            - outbreak:access
            - surveillance:read
            - surveillance:import
            - surveillance:manage_alerts
    - clientId: report-browser
      displayName: Report Browser
      icon: reporting
      launchUrl: /portal/apps/dwh/reports
      category: reports
      enabled: true
      accessRoles:
        - report-browser_access
        - report_viewer
        - report_analyst
        - report_manager
        - report_admin
      roles:
        - name: report-browser_access
          displayName: Report Browser Access
          permissions:
            - report_browser:read
        - name: report_admin
          displayName: Report Admin
          permissions:
            - report_browser:read
            - metrics:read
            - audit:read
        - name: report_manager
          displayName: Report Manager
          permissions:
            - report_browser:read
            - metrics:read
        - name: report_analyst
          displayName: Report Analyst
          permissions:
            - report_browser:read
            - data_quality:read
        - name: report_viewer
          displayName: Report Viewer
          permissions:
            - report_browser:read
realmRoles:
    - name: admin
      permissions:
        - '*'
    - name: user
      permissions:
        - portal:access
        - systems:read
        - systems:launch
    - name: manager
      permissions:
        - portal:access
        - systems:read
        - systems:launch
        - users:read
        - clients:read
        - announcements:read
        - documents:read
        - surveillance:read
        - data_quality:read
        - data_quality:write
        - notifications:read
