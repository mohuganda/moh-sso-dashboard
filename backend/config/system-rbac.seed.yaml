systems:
  - clientId: dashboard-web
    displayName: Integrated Health Portal
    description: Central portal shell
    icon: dashboard
    launchUrl: /portal
    category: platform
    systemType: platform
    displayInLauncher: true
    displayInSideNav: false
    launchMode: internal
    enabled: true
    accessRoles:
      - dashboard-web_access
    roles:
      - name: dashboard-web_access
        displayName: Dashboard Access
        description: Access MOH Dashboard
        permissions:
          - portal:access
          - systems:read
          - systems:launch

      - name: portal_admin
        displayName: Portal Admin
        description: Portal administrator access
        permissions:
          - "*"

      - name: portal_manager
        displayName: Portal Manager
        description: Portal manager access
        permissions:
          - portal:access
          - systems:read
          - systems:launch
          - users:read
          - clients:read
          - announcements:read
          - documents:read
          - document_templates:read
          - surveillance:read
          - report_browser:read
          - notifications:read

      - name: portal_user
        displayName: Portal User
        description: Standard portal user access
        permissions:
          - portal:access
          - systems:read
          - systems:launch

  - clientId: outbreak-management
    displayName: Outbreak Management
    description: Signals, alerts, surveillance, points of entry, and case management.
    icon: warning-alt
    launchUrl: /portal/apps/outbreak-management
    category: surveillance
    systemType: platform
    displayInLauncher: false
    displayInSideNav: true
    launchMode: internal
    navigation: |-
      [
        {"id":"signals-alerts","label":"Signals & Alerts","path":"/apps/outbreak-management/signals-alerts"},
        {"id":"poe-management","label":"PoE Management","path":"/apps/outbreak-management/poe-management"},
        {"id":"case-management","label":"Case Management","path":"/apps/outbreak-management/case-management"}
      ]
    enabled: true
    accessRoles:
      - outbreak-management_access
      - viewer
      - data_entry
      - surveillance_officer
      - manager
      - admin
      - super_admin
    roles:
      - name: outbreak-management_access
        displayName: Outbreak Management Access
        description: Base access to Outbreak Management
        permissions:
          - portal:access
          - systems:read
          - systems:launch
          - outbreak:access
          - surveillance:read

      - name: super_admin
        displayName: Super Administrator
        description: Super Administrator with full system access
        permissions:
          - outbreak:access
          - outbreak:manage
          - surveillance:read
          - surveillance:import
          - surveillance:manage_locations
          - surveillance:manage_alerts
          - data_quality:read
          - data_quality:write
          - data_quality:resolve
          - documents:read
          - documents:write
          - documents:process

      - name: admin
        displayName: Administrator
        description: Administrator with management access
        permissions:
          - outbreak:access
          - outbreak:manage
          - surveillance:read
          - surveillance:import
          - surveillance:manage_locations
          - surveillance:manage_alerts
          - data_quality:read
          - data_quality:write
          - data_quality:resolve

      - name: manager
        displayName: Manager
        description: Department manager with oversight access
        permissions:
          - outbreak:access
          - surveillance:read
          - data_quality:read
          - data_quality:write
          - documents:read

      - name: viewer
        displayName: Viewer
        description: Read-only access to reports and data
        permissions:
          - outbreak:access
          - surveillance:read
          - data_quality:read
          - documents:read

      - name: data_entry
        displayName: Data Entry
        description: Data entry personnel
        permissions:
          - outbreak:access
          - surveillance:read
          - surveillance:import
          - data_quality:read
          - data_quality:write

      - name: lab_technician
        displayName: Lab Technician
        description: Laboratory technician with lab-specific access
        permissions:
          - outbreak:access
          - surveillance:read
          - data_quality:read
          - data_quality:write

      - name: surveillance_officer
        displayName: Surveillance Officer
        description: Surveillance officer with monitoring access
        permissions:
          - outbreak:access
          - surveillance:read
          - surveillance:import
          - surveillance:manage_alerts

  - clientId: data-statistics
    displayName: Data & Statistics
    description: Data quality, document management, reports, surveillance, and issue tracking tools.
    icon: home
    launchUrl: /portal/apps/dwh
    category: platform
    systemType: platform
    displayInLauncher: false
    displayInSideNav: true
    launchMode: internal
    navigation: |-
      [
        {"id":"data-visualizer","label":"Data Visualizer","path":"/apps/dwh/data-visualizer","permission":"data_quality:read"},
        {"id":"data-validation","label":"Data Validation","path":"/apps/dwh/data-validation","permission":"data_quality:read"},
        {"id":"dashboards","label":"Dashboards","path":"/apps/dwh/dashboards","permission":"data_quality:read"},
        {"id":"reports","label":"Reports","path":"/apps/dwh/reports","permission":"report_browser:read"},
        {"id":"data-exports","label":"Data Exports","path":"/apps/dwh/exports","permission":"data_quality:read"},
        {"id":"file-svr","label":"Document Management","path":"/apps/dwh/filesvr","permission":"documents:read"},
        {"id":"surveillance","label":"Surveillance","path":"/apps/dwh/surveillance","permission":"surveillance:read"},
        {"id":"issue-tracker","label":"Issue Tracking","path":"/apps/dwh/issue-tracker","permission":"issue_tracker:read"}
      ]
    enabled: true
    accessRoles:
      - data-statistics_access
      - report_viewer
      - report_analyst
      - report_manager
      - report_admin
      - issue_tracker_viewer
      - issue_tracker_contributor
      - issue_tracker_editor
      - issue_tracker_manager
      - document_viewer
      - document_editor
      - document_processor
      - document_manager
    roles:
      - name: data-statistics_access
        displayName: Data & Statistics Access
        description: Default access to Data & Statistics
        permissions:
          - portal:access
          - systems:read
          - systems:launch
          - data_quality:read
          - issue_tracker:read
          - documents:read
          - surveillance:read
          - report_browser:read

      - name: report_admin
        displayName: Report Admin
        description: Report Browser administrator access
        permissions:
          - report_browser:read
          - metrics:read
          - audit:read

      - name: report_manager
        displayName: Report Manager
        description: Report Browser manager access
        permissions:
          - report_browser:read
          - metrics:read

      - name: report_analyst
        displayName: Report Analyst
        description: Report Browser analyst access
        permissions:
          - report_browser:read
          - data_quality:read

      - name: report_viewer
        displayName: Report Viewer
        description: Report Browser read-only access
        permissions:
          - report_browser:read

      - name: issue_tracker_viewer
        displayName: Issue Tracker Viewer
        description: Read-only access to issue records and issue history
        permissions:
          - issue_tracker:read

      - name: issue_tracker_contributor
        displayName: Issue Tracker Contributor
        description: Can view issues and add comments
        permissions:
          - issue_tracker:read
          - issue_tracker:comment

      - name: issue_tracker_editor
        displayName: Issue Tracker Editor
        description: Can create, edit, and comment on issues
        permissions:
          - issue_tracker:read
          - issue_tracker:write
          - issue_tracker:comment

      - name: issue_tracker_manager
        displayName: Issue Tracker Manager
        description: Can manage the complete issue lifecycle
        permissions:
          - issue_tracker:read
          - issue_tracker:write
          - issue_tracker:manage
          - issue_tracker:assign
          - issue_tracker:close
          - issue_tracker:reopen
          - issue_tracker:comment

      - name: document_viewer
        displayName: Document Viewer
        description: Read-only access to documents
        permissions:
          - documents:read
          - storage_locations:read

      - name: document_editor
        displayName: Document Editor
        description: Can view, upload, update, and delete documents
        permissions:
          - documents:read
          - storage_locations:read
          - documents:write

      - name: document_processor
        displayName: Document Processor
        description: Can view and process documents
        permissions:
          - documents:read
          - storage_locations:read
          - documents:process

      - name: document_manager
        displayName: Document Manager
        description: Full document management access
        permissions:
          - documents:read
          - storage_locations:read
          - documents:write
          - documents:process

  - clientId: eservices
    displayName: eServices
    description: Digital service requests and operational tools.
    icon: application
    launchUrl: /portal/apps/eservices
    category: services
    systemType: platform
    displayInLauncher: false
    displayInSideNav: true
    launchMode: internal
    navigation: |-
      [
        {"id":"ihris","label":"iHRIS","path":"/apps/eservices/ihris"},
        {"id":"meeting-manager","label":"Meeting Manager","path":"/apps/eservices/meeting-manager"},
        {"id":"action-tracker","label":"Action Tracker","path":"/apps/eservices/action-tracker"},
        {"id":"clinician-outputs","label":"Clinician Outputs","path":"/apps/eservices/clinician-outputs"},
        {"id":"leave-absence","label":"Leave & Absence Management","path":"/apps/eservices/leave-absence"},
        {"id":"workplans","label":"Workplans","path":"/apps/eservices/workplans"},
        {"id":"budget-tracker","label":"Budget Tracker","path":"/apps/eservices/budget-tracker"},
        {"id":"activity-reporting","label":"Activity Reporting","path":"/apps/eservices/activity-reporting"},
        {"id":"partner-management","label":"Partner Management","path":"/apps/eservices/partner-management"},
        {"id":"observatory-uploads","label":"Observatory Uploads","path":"/apps/eservices/observatory-uploads"}
      ]
    enabled: true
    accessRoles:
      - eservices_access
    roles:
      - name: eservices_access
        displayName: eServices Access
        description: Default access to eServices
        permissions:
          - portal:access
          - systems:read
          - systems:launch

  - clientId: research-studies
    displayName: Research & Studies
    description: Research studies, datasets, ethics approvals, and publications.
    icon: microscope
    launchUrl: /portal/apps/research-studies
    category: research
    systemType: platform
    displayInLauncher: false
    displayInSideNav: true
    launchMode: internal
    navigation: |-
      [
        {"id":"studies","label":"Studies","path":"/apps/research-studies/studies"},
        {"id":"datasets","label":"Datasets","path":"/apps/research-studies/datasets"},
        {"id":"ethics-approvals","label":"Ethics & Approvals","path":"/apps/research-studies/ethics"},
        {"id":"publications","label":"Publications","path":"/apps/research-studies/publications"}
      ]
    enabled: true
    accessRoles:
      - research-studies_access
    roles:
      - name: research-studies_access
        displayName: Research & Studies Access
        description: Default access to Research & Studies
        permissions:
          - portal:access
          - systems:read
          - systems:launch

  - clientId: case-registers
    displayName: Case Registers
    description: Case registers and referral tracking.
    icon: document
    launchUrl: /portal/apps/case-registers
    category: clinical
    systemType: platform
    displayInLauncher: false
    displayInSideNav: true
    launchMode: internal
    navigation: |-
      [
        {"id":"external-referrals","label":"External Referrals","path":"/apps/case-registers/external-referrals"},
        {"id":"disease-registers","label":"Disease Registers","path":"/apps/case-registers/disease-registers"}
      ]
    enabled: true
    accessRoles:
      - case-registers_access
    roles:
      - name: case-registers_access
        displayName: Case Registers Access
        description: Default access to Case Registers
        permissions:
          - portal:access
          - systems:read
          - systems:launch
          - documents:read

  - clientId: reference-registers
    displayName: Reference Registers
    description: Facility, terminology, and reference data registers.
    icon: catalog
    launchUrl: /portal/apps/reference-registers
    category: registry
    systemType: platform
    displayInLauncher: false
    displayInSideNav: true
    launchMode: internal
    navigation: |-
      [
        {"id":"facility-register","label":"Facility Register","path":"/apps/reference-registers/facility-register"},
        {"id":"terminology-service","label":"Terminology Service","children":[
          {"id":"test-menu","label":"Test Menu","path":"/apps/reference-registers/terminology/test-menu"},
          {"id":"pharmaceuticals","label":"Pharmaceuticals","path":"/apps/reference-registers/terminology/pharmaceuticals"},
          {"id":"procedures","label":"Procedures","path":"/apps/reference-registers/terminology/procedures"},
          {"id":"equipment","label":"Equipment","path":"/apps/reference-registers/terminology/equipment"}
        ]}
      ]
    enabled: true
    accessRoles:
      - reference-registers_access
    roles:
      - name: reference-registers_access
        displayName: Reference Registers Access
        description: Default access to Reference Registers
        permissions:
          - portal:access
          - systems:read
          - systems:launch

  - clientId: utilities
    displayName: Utilities
    description: Self-service utilities and staff tools.
    icon: tools
    launchUrl: /portal/apps/utilities/self-service
    category: utilities
    systemType: platform
    displayInLauncher: false
    displayInSideNav: true
    launchMode: internal
    navigation: |-
      [
        {"id":"self-service","label":"Self Service","children":[
          {"id":"my-timesheet","label":"My Timesheet","path":"/apps/utilities/self-service/timesheet"},
          {"id":"elearning","label":"eLearning","path":"/apps/utilities/self-service/elearning"},
          {"id":"leave-plan","label":"Leave Plan","path":"/apps/utilities/self-service/leave-plan"},
          {"id":"absence-requests","label":"Absence Requests","path":"/apps/utilities/self-service/absence-requests"},
          {"id":"absence-dashboard","label":"My Absence Dashboard","path":"/apps/utilities/self-service/absence-dashboard"},
          {"id":"eservice-requests","label":"eService Requests","children":[
            {"id":"document-upload","label":"Document Upload","path":"/apps/utilities/self-service/eservice/document-upload","permission":"documents:write"},
            {"id":"service-access","label":"Service Access","path":"/apps/utilities/self-service/eservice/service-access"},
            {"id":"equipment-request","label":"Equipment Request","path":"/apps/utilities/self-service/eservice/equipment-request"}
          ]}
        ]}
      ]
    enabled: true
    accessRoles:
      - utilities_access
      - utilities_document_uploader
    roles:
      - name: utilities_access
        displayName: Utilities Access
        description: Default access to Utilities
        permissions:
          - portal:access
          - systems:read
          - systems:launch

      - name: utilities_document_uploader
        displayName: Utilities Document Uploader
        description: Can upload documents through the self-service document upload utility
        permissions:
          - portal:access
          - systems:read
          - systems:launch
          - documents:read
          - documents:write

  - clientId: settings
    displayName: Settings
    description: User profile, session, and security settings.
    icon: settings
    launchUrl: /portal/apps/settings
    category: platform
    systemType: platform
    displayInLauncher: false
    displayInSideNav: true
    launchMode: internal
    navigation: |-
      [
        {"id":"profile","label":"My Profile","path":"/apps/settings/profile"},
        {"id":"sessions","label":"Active Sessions","path":"/apps/settings/sessions"},
        {"id":"security","label":"Security","path":"/apps/settings/security"}
      ]
    enabled: true
    accessRoles:
      - settings_access
    roles:
      - name: settings_access
        displayName: Settings Access
        description: Default access to Settings
        permissions:
          - portal:access
          - systems:read
          - systems:launch

  - clientId: demo-platform-system
    displayName: Demo Platform System
    description: Development example of an internal platform system with side navigation.
    icon: dashboard
    launchUrl: /portal/apps/dwh
    category: platform
    systemType: platform
    displayInLauncher: true
    displayInSideNav: false
    launchMode: internal
    navigation: |-
      [
        {"id":"overview","label":"Overview","path":"/apps/dwh"},
        {"id":"reports","label":"Reports","path":"/apps/dwh/reports","permission":"report_browser:read"}
      ]
    enabled: true
    accessRoles:
      - demo-platform-system_access
    roles:
      - name: demo-platform-system_access
        displayName: Demo Platform System Access
        description: Development access role for Demo Platform System
        permissions:
          - portal:access
          - systems:read
          - systems:launch

  - clientId: demo-external-new-tab
    displayName: External Health System
    description: Development example of a launcher-only external system opening in a new tab.
    icon: application
    launchUrl: https://example.org/external-health-system
    category: external
    systemType: external
    displayInLauncher: true
    displayInSideNav: false
    launchMode: new_tab
    enabled: true
    accessRoles:
      - demo-external-new-tab_access
    roles:
      - name: demo-external-new-tab_access
        displayName: External Health System Access
        description: Development access role for External Health System
        permissions:
          - portal:access
          - systems:read
          - systems:launch

  - clientId: demo-external-same-tab
    displayName: External Support Portal
    description: Development example of a launcher-only external system opening in the current tab.
    icon: help
    launchUrl: https://example.org/support
    category: support
    systemType: external
    displayInLauncher: true
    displayInSideNav: false
    launchMode: same_tab
    enabled: true
    accessRoles:
      - demo-external-same-tab_access
    roles:
      - name: demo-external-same-tab_access
        displayName: External Support Portal Access
        description: Development access role for External Support Portal
        permissions:
          - portal:access
          - systems:read
          - systems:launch

realmRoles:
  - name: admin
    description: Administrator role with full access
    permissions:
      - "*"

  - name: user
    description: Standard user role with read-only access to common platform services
    permissions:
      - portal:access
      - systems:read
      - systems:launch
      - data_quality:read
      - issue_tracker:read
      - documents:read
      - storage_locations:read
      - surveillance:read
      - report_browser:read
    systemRoles:
      data-statistics:
        - data-statistics_access
      utilities:
        - utilities_access
      settings:
        - settings_access

  - name: manager
    description: Can manage applications and operational workflows
    permissions:
      - portal:access
      - systems:read
      - systems:launch
      - users:read
      - clients:read
      - announcements:read
      - documents:read
      - documents:write
      - documents:process
      - surveillance:read
      - data_quality:read
      - data_quality:write
      - issue_tracker:read
      - issue_tracker:write
      - issue_tracker:manage
      - issue_tracker:assign
      - issue_tracker:close
      - issue_tracker:reopen
      - issue_tracker:comment
      - notifications:read
    systemRoles:
      data-statistics:
        - data-statistics_access
        - report_manager
        - issue_tracker_manager
        - document_manager
      utilities:
        - utilities_access
        - utilities_document_uploader
