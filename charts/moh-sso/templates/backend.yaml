{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
        {{- include "moh-sso.labels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}

      containers:
        - name: api
          image: {{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.backend.service.port }}

          # 🔹 Mount app.env as file
          volumeMounts:
            - name: app-config
              mountPath: /app/app.env
              subPath: app.env
              readOnly: true

          # 🔹 (Optional) keep envFrom if you still want extra vars
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-backend-config
            - secretRef:
                name: {{ .Release.Name }}-backend-secret

          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readinessPath }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 8
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.livenessPath }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 15

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

      # 🔹 Define the ConfigMap volume
      volumes:
        - name: app-config
          configMap:
            name: {{ .Release.Name }}-backend-config
            items:
              - key: app.env
                path: app.env

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Release.Name }}-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
  type: ClusterIP
{{- end }}
