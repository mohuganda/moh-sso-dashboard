{{- if .Values.backend.enabled }}
{{- $storageProvider := lower (default "" .Values.backend.storage.provider) -}}
{{- $filesystemStorage := or (eq $storageProvider "local") (eq $storageProvider "nfs") -}}
{{- if and $filesystemStorage .Values.backend.storage.persistence.enabled (not .Values.backend.storage.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-backend-uploads-pvc
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.backend.storage.persistence.accessModes | nindent 4 }}
  {{- if .Values.backend.storage.persistence.storageClassName }}
  storageClassName: {{ .Values.backend.storage.persistence.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.storage.persistence.size | quote }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
        {{- include "moh-sso.labels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if and $filesystemStorage .Values.backend.storage.podSecurityContext.enabled }}
      securityContext:
        fsGroup: {{ .Values.backend.storage.podSecurityContext.fsGroup }}
      {{- end }}

      initContainers:
        # 1. Wait for Postgres first
        - name: wait-for-db
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              echo "Waiting for database..."
              until pg_isready -h {{ .Release.Name }}-postgres-app -p 5432; do
                echo "Database not ready yet..."
                sleep 2
              done
              echo "Database is ready!"

        {{- if .Values.keycloak.enabled }}
        # 2. Wait for bundled Keycloak
        - name: wait-for-keycloak
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              echo "Waiting for Keycloak health endpoint..."
              until curl -fsS "http://{{ .Release.Name }}-keycloak:{{ .Values.keycloak.service.port }}/health/live" >/dev/null; do
                echo "Keycloak not ready yet - sleeping 5s"
                sleep 5
              done

              echo "Keycloak is responding! Handing off to backend..."
        {{- end }}

      containers:
        - name: api
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          
          # Environment and Config
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-backend-config
            - secretRef:
                name: {{ .Release.Name }}-backend-secret
          
          volumeMounts:
            - name: app-config
              mountPath: /app/app.env
              subPath: app.env
              readOnly: true
            {{- if $filesystemStorage }}
            - name: uploads
              mountPath: {{ ternary .Values.backend.storage.nfsBasePath .Values.backend.storage.localBasePath (eq $storageProvider "nfs") | quote }}
            {{- end }}

          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readinessPath | default "/health/ready" }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 8
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.livenessPath | default "/health/live" }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 15

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

      volumes:
        - name: app-config
          configMap:
            name: {{ .Release.Name }}-backend-config
            items:
              - key: app.env
                path: app.env
        {{- if $filesystemStorage }}
        - name: uploads
          {{- if .Values.backend.storage.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-backend-uploads-pvc" .Release.Name) .Values.backend.storage.persistence.existingClaim | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Release.Name }}-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
  type: ClusterIP
{{- end }}
