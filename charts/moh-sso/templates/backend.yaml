{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
        {{- include "moh-sso.labels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}

      initContainers:
        # 1. Wait for Postgres first
        - name: wait-for-db
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              echo "Waiting for database..."
              until pg_isready -h {{ .Release.Name }}-postgres-app -p 5432; do
                echo "Database not ready yet..."
                sleep 2
              done
              echo "Database is ready!"

        # 2. Wait for Keycloak realm endpoint on the public HTTP service port.
        - name: wait-for-keycloak
          image: curlimages/curl:8.10.1
          command:
            - sh
            - -c
            - |
              echo "Waiting for Keycloak realm endpoint..."
              until curl -fsS "http://{{ .Release.Name }}-keycloak:{{ .Values.keycloak.service.port }}/realms/{{ include "moh-sso.keycloak.realm" . }}" >/dev/null; do
                echo "Keycloak not ready yet - sleeping 5s"
                sleep 5
              done

              echo "Keycloak is responding! Handing off to backend..."

      containers:
        - name: api
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.service.port }}
          
          # Environment and Config
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-backend-config
            - secretRef:
                name: {{ .Release.Name }}-backend-secret
          
          volumeMounts:
            - name: app-config
              mountPath: /app/app.env
              subPath: app.env
              readOnly: true

          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readinessPath | default "/health/ready" }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: {{ .Values.backend.probes.readinessInitialDelaySeconds | default 8 }}
            periodSeconds: {{ .Values.backend.probes.periodSeconds | default 10 }}
            timeoutSeconds: {{ .Values.backend.probes.timeoutSeconds | default 1 }}
            failureThreshold: {{ .Values.backend.probes.failureThreshold | default 3 }}

          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.livenessPath | default "/health/live" }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: {{ .Values.backend.probes.livenessInitialDelaySeconds | default 15 }}
            periodSeconds: {{ .Values.backend.probes.periodSeconds | default 15 }}
            timeoutSeconds: {{ .Values.backend.probes.timeoutSeconds | default 1 }}
            failureThreshold: {{ .Values.backend.probes.failureThreshold | default 3 }}

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

      volumes:
        - name: app-config
          configMap:
            name: {{ .Release.Name }}-backend-config
            items:
              - key: app.env
                path: app.env
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Release.Name }}-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
  type: ClusterIP
{{- end }}
