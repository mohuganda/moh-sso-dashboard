{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-backend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-backend
        {{- include "moh-sso.labels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}

      # 🔥 Init container — wait for Postgres
      initContainers:
      - name: wait-for-db
        image: postgres:15-alpine
        command:
          - sh
          - -c
          - >
            echo "Waiting for database...";
            until pg_isready -h {{ printf "%s-postgres-app" .Release.Name }} -p 5432;
            do
              echo "Database not ready yet...";
              sleep 2;
            done;
            echo "Database is ready!"


      containers:
        - name: api
          image: {{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.backend.service.port }}

          volumeMounts:
            - name: app-config
              mountPath: /app/app.env
              subPath: app.env
              readOnly: true

          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-backend-config
            - secretRef:
                name: {{ .Release.Name }}-backend-secret

          readinessProbe:
            httpGet:
              path: {{ .Values.backend.probes.readinessPath }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 8
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: {{ .Values.backend.probes.livenessPath }}
              port: {{ .Values.backend.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 15

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

      volumes:
        - name: app-config
          configMap:
            name: {{ .Release.Name }}-backend-config
            items:
              - key: app.env
                path: app.env

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Release.Name }}-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.service.port }}
  type: ClusterIP
{{- end }}
