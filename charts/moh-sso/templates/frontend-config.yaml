{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-frontend-config
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
data:
  config.js: |
    window.__APP_CONFIG__ = {
      API_BASE_URL: "http://{{ .Release.Name }}-backend:{{ .Values.backend.service.port }}",
      KEYCLOAK_BASE_URL: "http://{{ .Release.Name }}-keycloak:{{ .Values.keycloak.service.port }}",
      KEYCLOAK_REALM: "moh-realm",
      KEYCLOAK_CLIENT_ID: "dashboard-web"
      KEYCLOAK_REDIRECT_URI:"http://localhost:9000/api/v1/auth/callback"
    };
{{- end }}
