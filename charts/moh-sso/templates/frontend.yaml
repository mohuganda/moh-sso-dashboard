{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-frontend
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-frontend
        {{- include "moh-sso.labels" . | nindent 8 }}
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.service.port }}

          {{- if .Values.frontend.runtimeConfig.enabled }}
          volumeMounts:
            - name: frontend-config
              mountPath: {{ .Values.frontend.runtimeConfig.mountPath | default "/usr/share/nginx/html/config.js" }}
              subPath: config.js
          {{- end }}

          readinessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.readinessPath | default "/" }}
              port: {{ .Values.frontend.service.port }}
            initialDelaySeconds: {{ .Values.frontend.probes.readinessInitialDelaySeconds | default 5 }}
            periodSeconds: 10
            timeoutSeconds: {{ .Values.frontend.probes.timeoutSeconds | default 1 }}

          livenessProbe:
            httpGet:
              path: {{ .Values.frontend.probes.livenessPath | default "/" }}
              port: {{ .Values.frontend.service.port }}
            initialDelaySeconds: {{ .Values.frontend.probes.livenessInitialDelaySeconds | default 10 }}
            periodSeconds: 15
            timeoutSeconds: {{ .Values.frontend.probes.timeoutSeconds | default 1 }}

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

      {{- if .Values.frontend.runtimeConfig.enabled }}
      volumes:
        - name: frontend-config
          configMap:
            name: {{ .Release.Name }}-frontend-config
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Release.Name }}-frontend
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.frontend.service.port }}
  type: ClusterIP
{{- end }}
