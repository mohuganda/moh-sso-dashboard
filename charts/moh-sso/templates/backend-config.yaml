{{- if .Values.backend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-backend-config
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ include "moh-sso.environment" . | quote }}
  GIN_MODE: {{ include "moh-sso.ginMode" . | quote }}

  FRONTEND_BASE_URL: {{ include "moh-sso.frontend.baseUrl" . | quote }}

  # --------------------------------------------------
  # Keycloak
  # --------------------------------------------------
  KEYCLOAK_EXTERNAL_URL: {{ include "moh-sso.keycloakPublicURL" . | quote }}
  KEYCLOAK_BASE_URL: {{ include "moh-sso.keycloak.baseUrl" . | quote }}
  KEYCLOAK_REALM: {{ include "moh-sso.keycloak.realm" . | quote }}

  KEYCLOAK_ADMIN_CLIENT_ID: "dashboard-admin"
  KEYCLOAK_WEB_CLIENT_ID: "dashboard-web"
  KEYCLOAK_REDIRECT_URI: {{ include "moh-sso.keycloak.redirectUri" . | quote }}

  # --------------------------------------------------
  # Server
  # --------------------------------------------------
  SERVER_PORT: {{ .Values.backend.service.port | quote }}

  # --------------------------------------------------
  # Database
  # --------------------------------------------------
  DB_DRIVER: "postgres"
  DB_HOST: {{ printf "%s-postgres-app" .Release.Name | quote }}
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgresApp.auth.database | quote }}
  DB_USER: {{ .Values.postgresApp.auth.username }}
  DB_PASSWORD: {{ .Values.postgresApp.auth.password }}
  DB_ENABLE_SSL: "false"

  # --------------------------------------------------
  # Redis
  # --------------------------------------------------
  REDIS_HOST: {{ printf "%s-redis" .Release.Name | quote }}
  REDIS_PORT: "6379"

  # --------------------------------------------------
  # Token Settings
  # --------------------------------------------------
  ACCESS_TOKEN_DURATION: "15m"
  REFRESH_TOKEN_DURATION: "720h"

  ENABLE_TLS: "false"

  # --------------------------------------------------
  # app.env (Flat file format)
  # --------------------------------------------------
  app.env: |
    ENVIRONMENT={{ include "moh-sso.environment" . }}
    GIN_MODE={{ include "moh-sso.ginMode" . }}

    FRONTEND_BASE_URL={{ include "moh-sso.frontend.baseUrl" . }}

    KEYCLOAK_EXTERNAL_URL={{ include "moh-sso.keycloakPublicURL" . }}
    KEYCLOAK_BASE_URL={{ include "moh-sso.keycloak.baseUrl" . }}
    KEYCLOAK_REALM={{ include "moh-sso.keycloak.realm" . }}

    KEYCLOAK_ADMIN_CLIENT_ID=dashboard-admin
    KEYCLOAK_WEB_CLIENT_ID=dashboard-web
    KEYCLOAK_REDIRECT_URI={{ include "moh-sso.keycloak.redirectUri" . }}

    SERVER_PORT={{ .Values.backend.service.port }}

    DB_DRIVER=postgres
    DB_HOST={{ printf "%s-postgres-app" .Release.Name }}
    DB_PORT=5432
    DB_NAME={{ .Values.postgresApp.auth.database }}
    DB_USER={{ .Values.postgresApp.auth.username }}
    DB_PASSWORD={{ .Values.postgresApp.auth.password }}
    DB_ENABLE_SSL=false

    REDIS_HOST={{ printf "%s-redis" .Release.Name }}
    REDIS_PORT=6379

    ACCESS_TOKEN_DURATION=15m
    REFRESH_TOKEN_DURATION=720h

    ENABLE_TLS=false
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-backend-secret
  labels:
    {{- include "moh-sso.labels" . | nindent 4 }}
type: Opaque
stringData:
  KEYCLOAK_ADMIN_CLIENT_SECRET: {{ .Values.backend.secrets.KEYCLOAK_ADMIN_CLIENT_SECRET | quote }}
  KEYCLOAK_WEB_CLIENT_SECRET: {{ .Values.backend.secrets.KEYCLOAK_WEB_CLIENT_SECRET | quote }}

  DB_USER: {{ .Values.postgresApp.auth.username | quote }}
  DB_PASSWORD: {{ .Values.postgresApp.auth.password | quote }}
{{- end }}
