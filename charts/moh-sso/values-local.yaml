# ===============================
# Local Laptop (Docker Desktop)
# ===============================

global:
  namespace: sso-local

# --------------------------------------------------
# Ingress (DISABLED FOR LOCAL)
# --------------------------------------------------
ingress:
  enabled: false

# --------------------------------------------------
# Backend API
# --------------------------------------------------
backend:
  enabled: true

  image:
    repository: moh-sso-dashboard-backend
    tag: local
    pullPolicy: Never

  replicas: 1

  env:
    PORT: "9000"
    ALLOWED_ORIGINS: "http://localhost:3000"

  secrets:
    KEYCLOAK_ADMIN_CLIENT_SECRET: dashboard-admin-secret
    KEYCLOAK_WEB_CLIENT_SECRET: dashboard-web-secret
    TOKEN_SYMMETRIC_KEY: supersecretkey12345678901234567890

  baseUrl: "http://localhost:9000"

  storage:
    provider: local
    localBasePath: /data/uploads

  notification:
    adminDashboardUrl: http://localhost:3000/portal/admin/home

  rbacStartupSync:
    # Local Kubernetes should boot even while Keycloak/RBAC data is settling.
    failOnError: false

  probes:
    readinessPath: /health/ready
    livenessPath: /health/live
    readinessInitialDelaySeconds: 90
    livenessInitialDelaySeconds: 180
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 12

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  hpa:
    enabled: false

  pdb:
    enabled: false

# --------------------------------------------------
# Frontend
# --------------------------------------------------
frontend:
  enabled: true

  image:
    repository: moh-sso-dashboard-frontend
    tag: local
    pullPolicy: Never

  service:
    port: 3000

  runtimeConfig:
    enabled: false
    mountPath: /app/public/config.js

  probes:
    readinessPath: /portal/
    livenessPath: /portal/
    readinessInitialDelaySeconds: 30
    livenessInitialDelaySeconds: 45
    timeoutSeconds: 5

  replicas: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  hpa:
    enabled: false

  pdb:
    enabled: false

# --------------------------------------------------
# Application Postgres
# --------------------------------------------------
postgresApp:
  enabled: true
  auth:
    database: sso_dashboard
    username: postgres
    password: postgres

  persistence:
    enabled: true
    size: 2Gi

# --------------------------------------------------
# Keycloak Postgres
# --------------------------------------------------
postgresKeycloak:
  enabled: true
  auth:
    database: keycloak
    username: keycloak
    password: keycloak

  persistence:
    enabled: true
    size: 2Gi

# --------------------------------------------------
# Keycloak
# --------------------------------------------------
keycloak:
  enabled: true
  replicas: 1

  admin:
    username: admin
    password: admin

  config:
    KC_LOG_LEVEL: DEBUG
    KC_DB: postgres
    KC_HTTP_ENABLED: "true"
    KC_PROXY: edge
    KC_HOSTNAME: "localhost"
    KC_HOSTNAME_STRICT: "false"
    KC_HOSTNAME_STRICT_HTTPS: "false"

# --------------------------------------------------
# Redis
# --------------------------------------------------
redis:
  enabled: true

  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  replicas: 1

  persistence:
    enabled: true
    size: 1Gi

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 256Mi
