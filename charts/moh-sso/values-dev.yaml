# ==================================================
# DEV VALUES (Ingress Disabled)
# Port-forward based development
# ==================================================

global:
  namespace: sso-dev
  environment: development

imagePullSecrets:
  - name: ghcr-secret

# --------------------------------------------------
# Ingress (Disabled in Dev)
# --------------------------------------------------
ingress:
  enabled: false

keycloakIngress:
  enabled: false

# --------------------------------------------------
# Backend
# --------------------------------------------------
backend:
  env:
    # Frontend will be accessed via localhost:3000
    ALLOWED_ORIGINS: "http://localhost:3000"

  baseUrl: "http://localhost:9000"

  secrets:
    KEYCLOAK_ADMIN_CLIENT_SECRET: "dev-dashboard-admin-secret"
    KEYCLOAK_WEB_CLIENT_SECRET: "dev-dashboard-web-secret"

# --------------------------------------------------
# Frontend
# --------------------------------------------------
frontend:
  enabled: true

  # Browser will hit backend via port-forward
  apiBaseUrl: "http://localhost:9000"

# --------------------------------------------------
# Postgres (App DB)
# --------------------------------------------------
postgresApp:
  auth:
    password: postgres

# --------------------------------------------------
# Postgres (Keycloak DB)
# --------------------------------------------------
postgresKeycloak:
  auth:
    password: keycloak

# --------------------------------------------------
# Keycloak (Internal for Dev)
# --------------------------------------------------
keycloak:
  admin:
    password: admin

  external:
    enabled: false

  config:
    KC_HTTP_ENABLED: "true"
    KC_PROXY: edge
    KC_HEALTH_ENABLED: "true"
    KC_METRICS_ENABLED: "true"

    # Dev: disable strict hostname validation
    KC_HOSTNAME_STRICT: "false"
    KC_HOSTNAME_STRICT_HTTPS: "false"

# --------------------------------------------------
# Redis
# --------------------------------------------------
redis:
  enabled: true
