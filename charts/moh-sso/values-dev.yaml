# ===============================
# Development values (Cluster)
# ===============================

global:
  namespace: sso-dev

# --------------------------------------------------
# Private GHCR Pull Secret
# --------------------------------------------------
imagePullSecrets:
  - name: ghcr-secret

# --------------------------------------------------
# Ingress
# --------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: sso-dev.moh.go.ug
  tls:
    enabled: true
    secretName: sso-dev-tls

# --------------------------------------------------
# Backend API
# --------------------------------------------------
backend:
  enabled: true

  image:
    repository: ghcr.io/mohuganda/moh-sso-dashboard-backend
    tag: "latest"
    pullPolicy: Always

  replicas: 1

  env:
    PORT: "9000"
    ALLOWED_ORIGINS: "https://sso-dev.moh.go.ug"

  secrets:
    KEYCLOAK_ADMIN_CLIENT_SECRET: dashboard-admin-secret
    KEYCLOAK_WEB_CLIENT_SECRET: dashboard-web-secret
    TOKEN_SYMMETRIC_KEY: supersecretkey12345678901234567890

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

  hpa:
    enabled: false

  pdb:
    enabled: false

# --------------------------------------------------
# Frontend
# --------------------------------------------------
frontend:
  enabled: true

  image:
    repository: ghcr.io/mohuganda/moh-sso-dashboard-frontend
    tag: "latest"
    pullPolicy: Always

  replicas: 1

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 256Mi

  hpa:
    enabled: false

  pdb:
    enabled: false

# --------------------------------------------------
# Application Postgres
# --------------------------------------------------
postgresApp:
  enabled: true
  auth:
    db: sso_dashboard
    user: postgres
    password: postgres

  persistence:
    enabled: true
    size: 5Gi

# --------------------------------------------------
# Keycloak Postgres
# --------------------------------------------------
postgresKeycloak:
  enabled: true
  auth:
    db: keycloak
    user: keycloak
    password: keycloak

  persistence:
    enabled: true
    size: 5Gi

# --------------------------------------------------
# Keycloak
# --------------------------------------------------
keycloak:
  enabled: true
  replicas: 1

  admin:
    username: admin
    password: admin

  config:
    KC_LOG_LEVEL: DEBUG
    KC_DB: postgres
    KC_HTTP_ENABLED: "true"
    KC_PROXY: edge
    KC_HOSTNAME: "sso-dev.moh.go.ug"
    KC_HOSTNAME_STRICT: "false"
    KC_HOSTNAME_STRICT_HTTPS: "true"

# --------------------------------------------------
# Redis
# --------------------------------------------------
redis:
  enabled: true

  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent

  replicas: 1

  persistence:
    enabled: true
    size: 2Gi

  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 256Mi
