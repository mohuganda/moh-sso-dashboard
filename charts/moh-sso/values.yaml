# ==================================================
# Base Helm values (DO NOT hardcode env specifics)
# ==================================================

global:
  environment: development
  namespace: default

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# --------------------------------------------------
# Ingress (overridden per environment)
# --------------------------------------------------
ingress:
  enabled: true
  className: nginx
  host: portal.local
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    nginx.ingress.kubernetes.io/x-forwarded-prefix: "/"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  tls:
    enabled: true
    secretName: portal-local-tls

# --------------------------------------------------
# Keycloak Ingress (separate host recommended)
# --------------------------------------------------
keycloakIngress:
  enabled: true
  className: nginx
  host: auth.portal.local
  annotations: {}
  tls:
    enabled: true
    secretName: auth-local-tls

# --------------------------------------------------
# Backend (Go API)
# --------------------------------------------------
backend:
  enabled: true

  replicas: 1

  image:
    repository: "ghcr.io/mohuganda/moh-sso-dashboard-backend" # injected by CI
    tag: "" # injected by CI; production must supply an immutable tag
    pullPolicy: Always

  service:
    port: 9000

  secrets:
    KEYCLOAK_ADMIN_CLIENT_SECRET: ""
    KEYCLOAK_WEB_CLIENT_SECRET: ""
    TOKEN_SYMMETRIC_KEY: ""

  env:
    PORT: "9000"
    ALLOWED_ORIGINS: ""

  remoteDatabase:
    host: ""
    port: "5432"
    username: ""
    password: ""
    database: ""

  dwhDatabase:
    host: ""
    port: "5432"
    username: ""
    password: ""
    database: ""

  storage:
    provider: local
    localBasePath: /data/uploads
    nfsBasePath: /mnt/nfs/uploads
    s3Region: us-east-1
    s3Bucket: ""
    s3AccessKeyId: ""
    s3SecretAccessKey: ""
    minioRegion: us-east-1
    minioEndpoint: http://minio:9000
    minioBucket: ""
    minioAccessKeyId: ""
    minioSecretAccessKey: ""

  smtp:
    host: mailhog
    port: 1025
    username: ""
    password: ""
    fromEmail: noreply@moh.go.ug
    fromName: MOH Integrated Health Portal
    connectTimeout: 10s
    sendTimeout: 15s

  email:
    maxAttachments: 5
    maxAttachmentBytes: 10485760
    allowedAttachmentTypes: pdf,doc,docx,xls,xlsx,csv,png,jpg,jpeg

  announcements:
    maxAttachments: 10
    maxAttachmentBytes: 10485760
    allowedAttachmentTypes: pdf,doc,docx,xls,xlsx,csv,png,jpg,jpeg

  notification:
    platformName: MOH Integrated Health Portal
    systemAdminEmail: admin@moh.go.ug
    systemAdminName: System Administrator
    adminDashboardUrl: ""

  rbacStartupSync:
    enabled: true
    seedEnabled: true
    seedPath: config/system-rbac.seed.yaml
    realmExport: true
    realmExportPath: ""
    liveKeycloak: true
    pushToKeycloak: true
    syncUsers: true
    failOnError: false

  sms:
    enabled: false
    provider: mock
    defaultCountryCode: "+256"
    fromName: MOH
    maxLength: 160
    sendTimeout: 10s
    africasTalkingUsername: ""
    africasTalkingApiKey: ""
    africasTalkingSenderId: ""
    twilioAccountSid: ""
    twilioAuthToken: ""
    twilioFromNumber: ""

  notificationDelivery:
    workerEnabled: true
    workerInterval: 3s
    batchSize: 20

  baseUrl: "" # optional override (used for redirect URI)

  probes:
    readinessPath: /health/ready
    livenessPath: /health/live
    readinessInitialDelaySeconds: 8
    livenessInitialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

  pdb:
    enabled: false
    minAvailable: 1

# --------------------------------------------------
# Frontend (React + Nginx)
# --------------------------------------------------
frontend:
  enabled: true

  replicas: 1

  image:
    repository: "ghcr.io/mohuganda/moh-sso-dashboard-frontend" # injected by CI
    tag: "" # injected by CI; production must supply an immutable tag
    pullPolicy: Always

  service:
    port: 80

  runtimeConfig:
    enabled: true
    mountPath: /usr/share/nginx/html/config.js

  probes:
    readinessPath: /
    livenessPath: /
    readinessInitialDelaySeconds: 5
    livenessInitialDelaySeconds: 10
    timeoutSeconds: 1

  baseUrl: "" # optional override
  apiBaseUrl: "" # optional override

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  pdb:
    enabled: false
    minAvailable: 1

# --------------------------------------------------
# Application Database (Postgres)
# --------------------------------------------------
postgresApp:
  enabled: true

  image:
    repository: postgres
    tag: 15-alpine

  auth:
    database: sso_dashboard
    username: postgres
    password: "" # overridden per environment

  persistence:
    enabled: true
    size: 10Gi
    accessModes:
      - ReadWriteOnce

# --------------------------------------------------
# Keycloak Database (Postgres)
# --------------------------------------------------
postgresKeycloak:
  enabled: true

  image:
    repository: postgres
    tag: 15-alpine

  auth:
    database: keycloak
    username: keycloak
    password: "" # overridden per environment

  persistence:
    enabled: true
    size: 10Gi
    accessModes:
      - ReadWriteOnce

# --------------------------------------------------
# Keycloak
# --------------------------------------------------
keycloak:
  enabled: true

  replicas: 1

  image:
    repository: quay.io/keycloak/keycloak
    tag: 26.0.6
    pullPolicy: IfNotPresent

  service:
    port: 8080

  admin:
    username: admin
    password: "" # overridden per environment

  baseUrl: ""
  realm: ""

  publicBaseUrl: ""
  external:
    enabled: false
    baseUrl: "" # https://sso.myorg.com
    realm: "" # moh-realm

  config:
    KC_DB: postgres
    KC_HTTP_ENABLED: "true"
    KC_PROXY: "edge"
    KC_HEALTH_ENABLED: "true"
    KC_METRICS_ENABLED: "true"
    KC_HOSTNAME_STRICT: "true"
    KC_HOSTNAME_STRICT_HTTPS: "true"
    KC_LOG_LEVEL: INFO
    KC_HOSTNAME: "portal.local"

# --------------------------------------------------
# Redis
# --------------------------------------------------
redis:
  enabled: true

  replicas: 1

  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent

  service:
    port: 6379

  auth:
    enabled: false
    password: "" # overridden per environment if enabled

  persistence:
    enabled: true
    size: 5Gi
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
