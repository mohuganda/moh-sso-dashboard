# ==================================================
# Base Helm values (DO NOT hardcode env specifics)
# ==================================================

global:
  environment: dev
  namespace: default

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# --------------------------------------------------
# Ingress (overridden per environment)
# --------------------------------------------------
ingress:
  enabled: false
  className: nginx
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# --------------------------------------------------
# Keycloak Ingress (separate host recommended)
# --------------------------------------------------
keycloakIngress:
  enabled: false
  className: nginx
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# --------------------------------------------------
# Backend (Go API)
# --------------------------------------------------
backend:
  enabled: true

  replicas: 1

  image:
    repository: "ghcr.io/mohuganda/moh-sso-dashboard-backend" # injected by CI
    tag: "latest" # injected by CI
    pullPolicy: IfNotPresent

  service:
    port: 9000

  secrets:
    KEYCLOAK_ADMIN_CLIENT_SECRET: ""
    KEYCLOAK_WEB_CLIENT_SECRET: ""

  env:
    PORT: "9000"
    ALLOWED_ORIGINS: ""

  baseUrl: "" # optional override (used for redirect URI)

  probes:
    readinessPath: /ready
    livenessPath: /health

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

  pdb:
    enabled: false
    minAvailable: 1

# --------------------------------------------------
# Frontend (React + Nginx)
# --------------------------------------------------
frontend:
  enabled: true

  replicas: 1

  image:
    repository: "ghcr.io/mohuganda/moh-sso-dashboard-frontend" # injected by CI
    tag: "latest" # injected by CI
    pullPolicy: IfNotPresent

  service:
    port: 80

  baseUrl: "" # optional override
  apiBaseUrl: "" # optional override

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

  pdb:
    enabled: false
    minAvailable: 1

# --------------------------------------------------
# Application Database (Postgres)
# --------------------------------------------------
postgresApp:
  enabled: true

  image:
    repository: postgres
    tag: 15-alpine

  auth:
    db: sso_dashboard
    user: postgres
    password: "" # overridden per environment

  persistence:
    enabled: true
    size: 10Gi
    accessModes:
      - ReadWriteOnce

# --------------------------------------------------
# Keycloak Database (Postgres)
# --------------------------------------------------
postgresKeycloak:
  enabled: true

  image:
    repository: postgres
    tag: 15-alpine

  auth:
    db: keycloak
    user: keycloak
    password: "" # overridden per environment

  persistence:
    enabled: true
    size: 10Gi
    accessModes:
      - ReadWriteOnce

# --------------------------------------------------
# Keycloak
# --------------------------------------------------
keycloak:
  enabled: true

  replicas: 1

  image:
    repository: quay.io/keycloak/keycloak
    tag: 26.0.6
    pullPolicy: IfNotPresent

  service:
    port: 8080

  admin:
    username: admin
    password: "" # overridden per environment

  baseUrl: ""
  realm: ""

  external:
    enabled: false
    baseUrl: "" # https://sso.myorg.com
    realm: "" # moh-realm

  config:
    KC_DB: postgres
    KC_HTTP_ENABLED: "true"
    KC_PROXY: edge
    KC_HEALTH_ENABLED: "true"
    KC_METRICS_ENABLED: "true"
    KC_HOSTNAME_STRICT: true
    KC_HOSTNAME_STRICT_HTTPS: true
    KC_HOSTNAME: localhost
    KC_LOG_LEVEL: INFO

# --------------------------------------------------
# Redis
# --------------------------------------------------
redis:
  enabled: true

  replicas: 1

  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent

  service:
    port: 6379

  auth:
    enabled: false
    password: "" # overridden per environment if enabled

  persistence:
    enabled: true
    size: 5Gi
    accessModes:
      - ReadWriteOnce

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
