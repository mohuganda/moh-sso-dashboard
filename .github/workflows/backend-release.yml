name: Backend Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

env:
  APP_NAME: moh-sso-dashboard
  MAIN_PACKAGE: ./cmd/api
  VERSION_PACKAGE: github.com/moh-sso-dashboard/backend/internal/version

jobs:
  create-tag-and-release:
    name: Create Tag and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          VERSION="${{ github.event.inputs.version }}"

          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version format: $VERSION"
            echo "Expected format: v1.0.0"
            exit 1
          fi

      - name: Check if tag already exists
        run: |
          VERSION="${{ github.event.inputs.version }}"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists."
            exit 1
          fi

      - name: Create Git tag
        run: |
          VERSION="${{ github.event.inputs.version }}"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build backend binary
        run: |
          VERSION="${{ github.event.inputs.version }}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          mkdir -p dist

          go build \
            -trimpath \
            -ldflags="-s -w \
              -X '${{ env.VERSION_PACKAGE }}.Version=${VERSION}' \
              -X '${{ env.VERSION_PACKAGE }}.Commit=${COMMIT}' \
              -X '${{ env.VERSION_PACKAGE }}.BuildTime=${BUILD_TIME}'" \
            -o "dist/${{ env.APP_NAME }}-${VERSION}-linux-amd64" \
            "${{ env.MAIN_PACKAGE }}"

      - name: Generate checksum
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Backend Release ${{ github.event.inputs.version }}
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
